name: Next.js CI & DevSecOps

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: 程式碼品質、型別檢查、Vitest 測試與架構異味分析（全 HTML 報告）
  quality-and-test:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 1. ESLint 靜態分析與程式碼異味報告
      - name: Run ESLint & Generate HTML Report
        continue-on-error: true
        run: npx eslint . -f html -o eslint-report.html

      # 2. TypeScript 靜態型別檢查
      - name: Run TypeScript type check
        run: npx tsc --noEmit

      # 3. Vitest 單元測試與覆蓋率 HTML 報告
      - name: Run Vitest Unit Tests with HTML & Coverage
        run: npx vitest run --coverage --reporter=default --reporter=html --outputFile=vitest-html/index.html

      # 4. 程式碼重複率掃描 (jscpd)
      - name: Run Code Duplication Check (jscpd)
        continue-on-error: true
        run: npx -y jscpd src --reporters "console,html" --output ./jscpd-report --ignore "**/*.test.{ts,tsx},src/test/**"

      # 5. 新增：模組循環依賴檢查 (madge) 並轉存 HTML 報告
      - name: Run Circular Dependency Check (madge)
        continue-on-error: true
        run: |
          npx -y madge --circular --extensions ts,tsx --ts-config tsconfig.json src > madge-output.txt 2>&1
          EXIT_CODE=$?
          echo "<h3>Madge 模組循環依賴檢查報告</h3><pre style='background:#f4f4f4;padding:16px;border-radius:8px;font-family:monospace;'>" > madge-report.html
          cat madge-output.txt >> madge-report.html
          echo "</pre>" >> madge-report.html
          exit $EXIT_CODE

      # 6. 新增：死碼檔案、未使用匯出與幽靈套件檢查 (knip) 並轉存 HTML 報告
      - name: Run Unused Files & Dependencies Check (knip)
        continue-on-error: true
        run: |
          npx -y knip --no-exit-code > knip-output.txt 2>&1
          echo "<h3>Knip 未使用檔案、匯出與依賴套件檢查報告</h3><pre style='background:#f4f4f4;padding:16px;border-radius:8px;font-family:monospace;'>" > knip-report.html
          cat knip-output.txt >> knip-report.html
          echo "</pre>" >> knip-report.html

      # 統一打包上傳所有品質、測試與架構分析 HTML 報告
      - name: Upload Quality & Test HTML Reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: quality-and-test-html-reports
          path: |
            eslint-report.html
            vitest-html/
            coverage/
            jscpd-report/
            madge-report.html
            knip-report.html

  # Job 2: 機密外洩、AI 幻覺套件、套件弱點與開源授權合規掃描（全 HTML 報告）
  security-and-compliance:
    name: Secret, Vuln & License Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (Full History for Gitleaks)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js for slop-deps
        uses: actions/setup-node@v5
        with:
          node-version: '26'

      - name: Run slop-deps Package Hallucination Scan
        id: slopdeps
        continue-on-error: true
        run: |
          npx -y slop-deps --strict > slop-deps-output.txt 2>&1
          EXIT_CODE=$?
          echo "<h3>slop-deps 套件幻覺與拼寫誤植掃描報告</h3><pre style='background:#f4f4f4;padding:16px;border-radius:8px;font-family:monospace;'>" > slop-deps-report.html
          cat slop-deps-output.txt >> slop-deps-report.html
          echo "</pre>" >> slop-deps-report.html
          exit $EXIT_CODE

      - name: Run Gitleaks Secret Scan
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_REPORT_FORMAT: json
          GITLEAKS_REPORT_PATH: gitleaks-report.json

      - name: Convert Gitleaks JSON to HTML
        if: always()
        run: npx -y json2html-cli gitleaks-report.json > gitleaks-report.html || echo "<h3>No secrets leaked or report generated.</h3>" > gitleaks-report.html

      - name: Download Trivy Official HTML Template
        run: curl -sL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl -o html.tpl

      - name: Run Trivy Vulnerability Scan (HTML)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          format: 'template'
          template: '@html.tpl'
          output: 'trivy-vuln-report.html'
          severity: 'HIGH,CRITICAL'

      - name: Run Trivy License Scan (HTML)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'license'
          format: 'template'
          template: '@html.tpl'
          output: 'trivy-license-report.html'

      - name: Upload Security & Compliance HTML Reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: security-compliance-html-reports
          path: |
            gitleaks-report.html
            trivy-vuln-report.html
            trivy-license-report.html
            slop-deps-report.html